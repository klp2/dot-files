# Personal machines (local-personal, remote-personal), on top of common.toml.

[tools]
cmake = "latest"
docker-compose = "latest"
goreleaser = "latest"
rust = "latest"
sqlc = "latest"
zellij = "latest"
"github:rojo-rbx/rojo" = "latest"
"npm:@google/gemini-cli" = "latest"

[bootstrap.packages]
# MaxMind's GitHub org enforces SAML, which rejects the token mise sends for
# release lookups, so these come from brew rather than github: tools
"brew:geoipupdate" = "latest"
"brew:mmdbinspect" = "latest"
