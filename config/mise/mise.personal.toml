# Personal machines (local-personal, remote-personal), on top of common.toml.

[tools]
cmake = "latest"
docker-cli = "latest"
docker-compose = "latest"
goreleaser = "latest"
# For ghidra, which needs a JDK 21
java = "temurin-21"
sqlc = "latest"
# sqlite3
sqlite = "latest"
zellij = "latest"
"github:rojo-rbx/rojo" = "latest"
"npm:@google/gemini-cli" = "latest"
# hb-shape, hb-view, hb-info
"conda:harfbuzz" = "latest"

# Ghidra's release zip has its launchers in two directories (ghidraRun at the
# top, analyzeHeadless and pyghidraRun in support/), and bin_path takes one, so
# postinstall links the three into bin/. They find their install through
# readlink -f. bin_path stops mise's automatic strip of the zip's top directory.
[tools."github:NationalSecurityAgency/ghidra"]
version = "latest"
asset_pattern = "ghidra_*_PUBLIC_*.zip"
strip_components = 1
bin_path = "bin"
postinstall = 'mkdir -p "$MISE_TOOL_INSTALL_PATH/bin" && for f in ghidraRun support/analyzeHeadless support/pyghidraRun; do ln -sf "../$f" "$MISE_TOOL_INSTALL_PATH/bin/"; done'

# XRoar (Dragon/CoCo emulator). Upstream ships no Linux binaries, so
# klp2/xroar-builds builds them from a checksum-pinned source tarball. No
# release-age wait for our own builds; the pin in that repo is the gate. Until
# conda-forge accepts its recipe (then this becomes conda:xroar).
[tools."github:klp2/xroar-builds"]
version = "latest"
asset_pattern = "xroar-*-linux-x86_64.tar.gz"
minimum_release_age = "0d"

# MaxMind's GitHub org enforces SAML, which rejects the token mise sends to the
# GitHub API, so these use the http backend instead: versions come from the
# public releases feed and checksums from each release's checksums.txt, with no
# API call or token. The feed lists newest first, hence version_order.
[tools."http:geoipupdate"]
version = "latest"
version_order = "semver"
strip_components = 1
version_list_url = "https://github.com/maxmind/geoipupdate/releases.atom"
version_regex = 'releases/tag/v(\d+\.\d+\.\d+)"'
url = "https://github.com/maxmind/geoipupdate/releases/download/v{{ version }}/geoipupdate_{{ version }}_{{ os() }}_{{ arch(x64=\"amd64\") }}.tar.gz"
checksum_url = "https://github.com/maxmind/geoipupdate/releases/download/v{{ version }}/geoipupdate_{{ version }}_checksums.txt"

[tools."http:mmdbinspect"]
version = "latest"
version_order = "semver"
strip_components = 1
version_list_url = "https://github.com/maxmind/mmdbinspect/releases.atom"
version_regex = 'releases/tag/v(\d+\.\d+\.\d+)"'
url = "https://github.com/maxmind/mmdbinspect/releases/download/v{{ version }}/mmdbinspect_{{ version }}_{{ os() }}_{{ arch(x64=\"amd64\") }}.tar.gz"
checksum_url = "https://github.com/maxmind/mmdbinspect/releases/download/v{{ version }}/checksums.txt"
