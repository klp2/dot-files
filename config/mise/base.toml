# Settings, shell environment, and dotfile links for every environment,
# remote-work included. install.sh links this into ~/.config/mise/conf.d/. Its
# variants below link in common.toml and the work or personal tools everywhere
# but remote-work, which gets no tools.

[settings]
# Disable backends that use community-maintained bash scripts (supply chain risk)
# See: https://github.com/jdx/mise/discussions/4054
disable_backends = ["asdf", "vfox"]
# Skip releases younger than this, so a compromised release has time to be
# caught and pulled before it lands here
minimum_release_age = "7d"
# Between install.sh runs, mise updates itself (checking at most weekly, and
# honoring minimum_release_age) before an interactive command. Standalone
# installs only; a packaged mise such as the devcontainer image's cannot.
self_update.auto = true

# Exported by `mise activate` in bashrc, and set for tools run through mise
# (shims, `mise x`). Values are not shell-expanded: ~ stays literal, so paths
# use {{ env.HOME }}. Anything that needs a runtime check or is envtype-specific
# stays in bashrc: a config.<env>.toml would lose it in projects that select
# their own env (MISE_ENV or a .miserc.toml).
[env]
EDITOR = "nvim"
# Linked below
RIPGREP_CONFIG_PATH = "{{ env.HOME }}/.config/ripgrep/config"

# Set by `mise activate` in every shell that sources bashrc, interactive or not
# (bash expands them only in interactive ones), so interactive-only aliases
# (find, grep) stay in bashrc. common.toml overrides ls and ll with eza.
[shell_alias]
vi = "nvim"
t = "tmux"
ls = "ls --color=auto"
ll = "ls -alh"
ga = "git add"
gd = "git diff"
gs = "git status"
# Local branches, least recently committed first
lgb = "git for-each-ref --sort=committerdate refs/heads/ --format='%(committerdate:short) %(authorname) %(refname:short)'"
# Local branches merged into HEAD (not the current one or main), and deleting
# them with the safe `git branch -d`. Squash-merged branches don't show.
show-merged-branches = 'git branch --no-color --merged | grep -v "\*" | grep -v main'
delete-merged-branches = "show-merged-branches | xargs -n 1 git branch -d"
# Integer to dotted IPv4 and back
intip = "perl -MSocket=inet_ntoa -le 'print inet_ntoa(pack(\"N\",shift))'"
ipint = "perl -MSocket -le 'print unpack(\"N\",inet_aton(shift))'"
# Verbose resource usage (peak RSS, page faults, context switches) written to
# time.output.<epoch>. Not named time: that would shadow the bash keyword,
# which can time functions, builtins, and whole pipelines.
vtime = 'NOWTIME=$(date +%s);/usr/bin/time -v -o time.output.$NOWTIME'

# Runs on every `mise bootstrap` (install.sh), so it must be safe to repeat
[bootstrap.hooks]
final = "~/dot-files/install/nvim.sh"

# tmux plugin manager, for the plugins in tmux.conf. install.sh clones it and,
# when upgrading, fast-forwards it.
[bootstrap.repos."~/.tmux/plugins/tpm"]
url = "https://github.com/tmux-plugins/tpm"

# Deployed by `mise dot apply` and `mise bootstrap` in install.sh. A relative
# source would resolve against conf.d, where this file is linked, so sources
# spell out ~/dot-files. Links that depend on a runtime check rather than the
# environment (~/.local_vimrc, i3 on a personal machine, Regolith, alacritty)
# are still made by the installers.
[dotfiles]
"~/.bash_common.sh" = "~/dot-files/bash_common.sh"
"~/.bash_profile" = "~/dot-files/bash_profile"
"~/.bashrc" = "~/dot-files/bashrc"
"~/.golangci.yml" = "~/dot-files/golangci.yml"
"~/.perltidyrc" = "~/dot-files/perltidyrc"
"~/.profile" = "~/dot-files/profile"
"~/.psqlrc" = "~/dot-files/psql/psqlrc"
"~/.screenrc" = "~/dot-files/screenrc"
"~/.tmux.conf" = "~/dot-files/tmux/tmux.conf"
"~/.tmux-default-layout" = "~/dot-files/tmux/tmux-default-layout"
"~/.tmux-three-win-layout" = "~/dot-files/tmux/tmux-three-win-layout"
"~/bin/git-prompt-fallback" = "~/dot-files/bin/git-prompt-fallback"
"~/.config/bat/config" = "~/dot-files/config/bat/config"
"~/.config/lnav/config.json" = "~/dot-files/config/lnav/config.json"
"~/.config/nvim/init.lua" = "~/dot-files/nvim/init.lua"
"~/.config/ripgrep/config" = "~/dot-files/config/ripgrep/config"
"~/.config/starship.toml" = "~/dot-files/starship.toml"
# A copy, so it can carry its own mode
"~/.dataprinter" = { source = "~/dot-files/dataprinter", mode = "copy", permissions = "0700" }

# Per-environment links. install.sh writes ~/.config/mise/miserc.toml from the
# envtype marker: each machine selects its envtype as its mise env, and
# local-work and local-personal also select "desktop". A variant names one
# profile, and an entry with no matching variant is skipped. Never give one
# entry two profiles that a machine selects together (desktop and local-work):
# the tie makes mise reject the entry.

# The per-environment bootstrap configs; only the selected ones load
"~/.config/mise/config.desktop.toml" = "~/dot-files/config/mise/config.desktop.toml"
"~/.config/mise/config.local-personal.toml" = "~/dot-files/config/mise/config.local-personal.toml"
"~/.config/mise/config.remote-work.toml" = "~/dot-files/config/mise/config.remote-work.toml"

# Tools, everywhere but remote-work. These stay in conf.d rather than in
# config.<env>.toml files: MISE_ENV, -E, or a project's .miserc.toml replaces
# the env list from miserc.toml, which would drop them. Later conf.d files win
# on overlap, so the work and personal files layer on top of common.toml.
[dotfiles."~/.config/mise/conf.d/10-dotfiles.toml"]
source = "~/dot-files/config/mise/common.toml"
variants = [
  { profile = "local-work" },
  { profile = "local-personal" },
  { profile = "remote-personal" },
  { profile = "devcontainer-work" },
]

[dotfiles."~/.config/mise/conf.d/20-work.toml"]
source = "~/dot-files/config/mise/mise.work.toml"
variants = [{ profile = "local-work" }, { profile = "devcontainer-work" }]

[dotfiles."~/.config/mise/conf.d/20-personal.toml"]
source = "~/dot-files/config/mise/mise.personal.toml"
variants = [{ profile = "local-personal" }, { profile = "remote-personal" }]

# vim, everywhere but remote-personal and devcontainer-work (neovim only).
# install/vim.sh picks ~/.local_vimrc, which depends on mm-perl being installed.
[dotfiles."~/.vimrc"]
source = "~/dot-files/vim/vimrc"
variants = [{ profile = "desktop" }, { profile = "remote-work" }]

# SQL heredoc syntax highlighting for Perl
[dotfiles."~/.vim/after/syntax/perl/heredoc-sql.vim"]
source = "~/dot-files/vim/heredoc-sql.vim"
variants = [{ profile = "desktop" }, { profile = "remote-work" }]

# i3 on the work laptop (Regolith). A personal machine gets these from
# install.sh only when i3 is installed.
[dotfiles."~/.config/i3"]
source = "~/dot-files/i3"
variants = [{ profile = "local-work" }]

[dotfiles."~/.config/i3status"]
source = "~/dot-files/i3status"
variants = [{ profile = "local-work" }]

# Devcontainer local customizations (a symlink, so deploy dereferences it)
[dotfiles."~/.config/devcontainer-local/startup.sh"]
source = "~/dot-files/devcontainer/startup.sh"
variants = [{ profile = "local-work" }]

# SSH: a fragment, never the whole config. ~/.ssh/config holds machine-specific
# host entries and absolute key paths, and both Trellis and the 1Password app
# rewrite it unprompted, so linking it would drop their edits into this tree.
# Only local desktops get the 1Password agent. config.desktop.toml adds the
# Include line (an edit entry, which takes no variants) and sets the modes.
[dotfiles."~/.ssh/config.d/1password.conf"]
source = "~/dot-files/ssh/1password.conf"
variants = [{ profile = "desktop" }]

# herdr, the agent-aware multiplexer on local desktops
[dotfiles."~/.config/herdr/config.toml"]
source = "~/dot-files/config/herdr/config.toml"
variants = [{ profile = "desktop" }]

# gaem launchers: start-dev roots an agent in an issue's worktree, and hdev
# opens that worktree as its own herdr workspace first
[dotfiles."~/bin/start-dev"]
source = "~/dot-files/bin/start-dev"
variants = [{ profile = "local-personal" }]

[dotfiles."~/bin/hdev"]
source = "~/dot-files/bin/hdev"
variants = [{ profile = "local-personal" }]
