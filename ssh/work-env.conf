# Forward the current shell token only to the work hosts that use it.
# After rotating the vault token, run `oprefresh` before reconnecting.
# Remove any GH_ENTERPRISE_TOKEN SetEnv literal from ~/.ssh/config.
# The server must allow GH_ENTERPRISE_TOKEN through AcceptEnv.
Host geoipbuild-us-* mm-sulu-dev
    SendEnv GH_ENTERPRISE_TOKEN
