# Managed by dotfiles -- symlinked to ~/.ssh/config.d/1password.conf by
# install.sh. Edit the copy in the repo, not the symlink.
#
# Routes ssh at the 1Password agent, which serves keys from the vault and
# unlocks biometrically. IdentityAgent supersedes $SSH_AUTH_SOCK for the ssh
# client, so this wins over whatever bashrc exports.
#
# Only settings that are true on EVERY local desktop belong here. Anything
# machine-specific -- host entries, IdentityFile paths -- stays in the real
# ~/.ssh/config, which is untracked precisely because Trellis and the 1Password
# app both rewrite it on their own.
#
# ssh takes the FIRST value it obtains for a keyword, and install.sh puts the
# Include ahead of every Host block (a bare Include lands inside whichever Host
# section contains it, which would scope this file to a single host). So the
# settings below take precedence over per-host blocks in ~/.ssh/config. Keep
# this file narrow for that reason.

Host *
    IdentityAgent ~/.1password/agent.sock
