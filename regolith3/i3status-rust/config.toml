[theme]
theme = "semi-native"

[icons]
icons = "awesome4"

[[block]]
block = "net"

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
alert_unit = "GB"
interval = 20
warning = 20.0
alert = 10.0
format = " $icon $available.eng(w:2) "

[[block]]
block = "memory"
format = " RAM:$mem_used.eng(w:2,p:Gi,hide_prefix:true,hide_unit:true)/$mem_total.eng(w:2,p:Gi) "
format_alt = " Swap $swap_used_percents.eng(w:2) used "

[[block]]
block = "battery"
format = " $icon  $percentage "
missing_format = ""
device = "DisplayDevice"
driver = "upower"

# Rofication block removed - using mako instead

[[block]]
block = "sound"
driver = "pulseaudio"

[[block.click]]
button = "left"
cmd = "regolith-control-center sound"

[[block]]
block = "time"
interval = 5
format = " $timestamp.datetime(f:'%a-%d/%m/%y')"

[[block]]
block = "time"
interval = 5
format = "$icon $timestamp.datetime(f:'%R')"
